# ChatBBS Nginx / OpenResty 配置示例
# 用法：把 server 段内容复制到站点配置，按注释修改 root / server_name / fastcgi_pass
# ------------------------------------------------------------------------------
#
# 【最小化配置】如果站点已存在，只需在 server {} 内加入下面 3 段（伪静态必须配置，
#   否则 /login、/forums、/admin 等都会 404）：
#
#   location ^~ /admin/ {
#       try_files $uri $uri/ /admin/index.php?$query_string;
#   }
#   location = /admin {
#       rewrite ^ /admin/index.php last;
#   }
#   location / {
#       try_files $uri $uri/ /index.php?$query_string;
#   }
#
# 改完后执行：nginx -t && nginx -s reload
# ------------------------------------------------------------------------------

server {
    listen 80;
    server_name bbs.example.com;
    root  /www/wwwroot/bbs.example.com;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 24m;

    access_log /www/wwwlogs/bbs.access.log;
    error_log  /www/wwwlogs/bbs.error.log;

    # ---------- 安全：禁止访问敏感目录 ----------
    location ^~ /app/        { deny all; }
    location ^~ /config/     { deny all; }
    location ^~ /plugins/    { deny all; }
    location ^~ /data/cache/ { deny all; }
    location ^~ /data/logs/  { deny all; }
    location ^~ /data/backups/ { deny all; }
    location ~* ^/data/.*\.(php|sql|log|ini)$ { deny all; }

    # ---------- 上传目录禁止执行 PHP ----------
    location ^~ /data/uploads/ {
        location ~ \.php$ { deny all; }
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 后台入口 ----------
    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.php?$query_string;
    }
    location = /admin {
        rewrite ^ /admin/index.php last;
    }

    # ---------- 前台入口 ----------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---------- PHP 解析 ----------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass   127.0.0.1:9000;      # 宝塔常见：unix:/tmp/php-cgi-80.sock
        fastcgi_index  index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  SCRIPT_NAME     $fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        fastcgi_read_timeout 120;
    }

    # ---------- 防止访问隐藏文件 ----------
    location ~ /\. {
        deny all;
    }
}
